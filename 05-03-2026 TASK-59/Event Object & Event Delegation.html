<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 7 - Event Object &amp; Event Delegation</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #eef2ff;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #4f46e5;
            font-size: 24px;
            color: #4f46e5;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #4f46e5;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        .menu { margin-top: 10px; padding: 10px; background: #312e81; border-radius: 8px; }
        .menu-item { margin: 5px 0; padding: 10px 12px; background: #4338ca; color: #ffffff; border-radius: 4px; cursor: pointer; transition: background 0.15s; }
        .menu-item:hover { background: #6366f1; }
        #output { max-height: 260px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Unit 7: Event Object &amp; Event Delegation</h1>

    <div class="panel">
        <button id="addNewItem">Add New Menu Item</button>
        <div id="menu" class="menu">
            <div class="menu-item">Dashboard</div>
            <div class="menu-item">Courses</div>
            <div class="menu-item">Profile</div>
        </div>
        <div id="output"></div>
    </div>

    <script src="Event Object & Event Delegation.js"></script>
</body>
</html>
