<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 4 - Creating Nodes</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f5f3ff;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #7c3aed;
            font-size: 24px;
            color: #7c3aed;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #7c3aed;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #7c3aed;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        #list { list-style: none; padding: 0; margin: 12px 0; }
        li { margin: 6px 0; padding: 10px; background: #ede9fe; border-left: 5px solid #8b5cf6; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Unit 4: Creating Nodes</h1>

    <div class="panel">
        <button id="addBtn">Add New Item</button>
        <button id="addComplexBtn">Add Complex Card</button>
        <ul id="list">
            <li>Starter item</li>
        </ul>
        <div id="output"></div>
    </div>

    <script src="Creating Nodes.js"></script>
</body>
</html>
