<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 6 - Event Handling Basics</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #fff1f2;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #be123c;
            font-size: 24px;
            color: #be123c;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #be123c;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #be123c;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        .panel { text-align: center; }
        #clickBox { width: 200px; height: 200px; margin: 10px auto 20px; line-height: 200px; border-radius: 16px; background: #e11d48; color: #ffffff; font-size: 20px; font-weight: bold; cursor: pointer; user-select: none; transition: transform 0.15s; }
        #clickBox:hover { transform: scale(1.04); }
        #clickBox:active { transform: scale(0.96); }
        #output { text-align: left; max-height: 220px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Unit 6: Event Handling Basics</h1>

    <div class="panel">
        <div id="clickBox">Tap Here!</div>
        <button id="attachMoreBtn">Attach Another Click Listener</button>
        <button id="removeListenerBtn">Remove One Listener</button>
        <div id="output"></div>
    </div>

    <script src="addEventListener.js"></script>
</body>
</html>
