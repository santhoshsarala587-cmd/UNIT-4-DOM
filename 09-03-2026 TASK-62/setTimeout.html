<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 10 - Timers Basics (setTimeout)</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #fefce8;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #a16207;
            font-size: 24px;
            color: #a16207;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #a16207;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #a16207;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        .panel { text-align: center; }
        .timer-box { padding: 20px; background: #fef08a; border-radius: 10px; }
        .timer-box h3 { margin-top: 0; }
        #countdownDisplay { margin: 10px 0 16px; font-family: Consolas, "Courier New", monospace; font-size: 34px; font-weight: bold; color: #713f12; }
        #output { text-align: left; max-height: 220px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Unit 10: Timers Basics (setTimeout)</h1>

    <div class="panel">
        <div class="timer-box">
            <h3>One-Time Timer (setTimeout)</h3>
            <div id="countdownDisplay">Not started</div>
            <button id="startTimerBtn">Start 5 Second Timer</button>
            <button id="cancelTimerBtn">Cancel Timer</button>
        </div>
        <div id="output"></div>
    </div>

    <script src="setTimeout.js"></script>
</body>
</html>
