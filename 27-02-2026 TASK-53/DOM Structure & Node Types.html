<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 1 - DOM Structure &amp; Node Types</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #eff6ff;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #2563eb;
            font-size: 24px;
            color: #2563eb;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        #container { padding: 12px; border: 2px dashed #93c5fd; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Unit 1: DOM Structure &amp; Node Types</h1>

    <div class="panel">
        <div id="container">
            <p id="textPara">Welcome to the DOM tree (ELEMENT_NODE).</p>
            <!-- This is a comment node (COMMENT_NODE) -->
            <span>Inline span element</span>
        </div>
        <button id="btnCheck">Check Node Types</button>
        <div class="output" id="outputArea"></div>
    </div>

    <script src="DOM Structure & Node Types.js"></script>
</body>
</html>
