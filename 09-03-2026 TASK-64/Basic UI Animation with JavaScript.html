<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 12 - Basic UI Animation with JS</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #fef2f2;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #b91c1c;
            font-size: 24px;
            color: #b91c1c;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #b91c1c;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #b91c1c;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        .animation-area { position: relative; min-height: 300px; padding: 20px; background: #fee2e2; border: 2px dashed #f87171; border-radius: 10px; }
        #animatedBox { position: relative; display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 10px; background: #b91c1c; color: #ffffff; font-weight: bold; }
        .btn-group { margin: 14px 0 0; }
        #output { max-height: 180px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Unit 12: Basic UI Animation with JavaScript</h1>

    <div class="panel">
        <div class="animation-area">
            <div id="animatedBox">Move Me</div>
        </div>
        <div class="btn-group">
            <button id="moveRightBtn">Move Right →</button>
            <button id="moveLeftBtn">← Move Left</button>
            <button id="moveDownBtn">Move Down ↓</button>
            <button id="moveUpBtn">↑ Move Up</button>
            <button id="fadeOutBtn">Fade Out</button>
            <button id="fadeInBtn">Fade In</button>
            <button id="resetAnimBtn">Reset Position</button>
        </div>
        <div id="output"></div>
    </div>

    <script src="Basic UI Animation with JavaScript.js"></script>
</body>
</html>
