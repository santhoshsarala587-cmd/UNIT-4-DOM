<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 9 - Form Validation Rules</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #eff6ff;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #1d4ed8;
            font-size: 24px;
            color: #1d4ed8;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #1d4ed8;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #1d4ed8;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 9px; border: 1px solid #94a3b8; border-radius: 6px; font: inherit; }
        input.error { border-color: #dc2626; background: #fef2f2; }
        .error-msg { display: none; margin-top: 5px; color: #dc2626; font-size: 13px; }
    </style>
</head>
<body>
    <h1>Unit 9: Form Validation - Rules</h1>

    <div class="panel">
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username (min 4 characters):</label>
                <input type="text" id="username">
                <div class="error-msg" id="usernameError">Username must be at least 4 characters</div>
            </div>

            <div class="form-group">
                <label for="email">Email (must contain @ and .):</label>
                <input type="email" id="email">
                <div class="error-msg" id="emailError">Enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="password">Password (min 8 characters):</label>
                <input type="password" id="password">
                <div class="error-msg" id="passwordError">Password must be at least 8 characters</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword">
                <div class="error-msg" id="confirmError">Passwords do not match</div>
            </div>

            <button type="submit">Register</button>
            <button type="button" id="validateBtn">Validate Only</button>
        </form>
        <div id="output"></div>
    </div>

    <script src="Form Validation.js"></script>
</body>
</html>
