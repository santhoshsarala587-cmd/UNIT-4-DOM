<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5 - Removing &amp; Updating Nodes</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #fff7ed;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #c2410c;
            font-size: 24px;
            color: #c2410c;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #c2410c;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #c2410c;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        #taskList { margin-top: 14px; }
        .task-item { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; padding: 10px 12px; background: #ffedd5; border-left: 5px solid #ea580c; border-radius: 4px; }
        .task-item button { margin: 0; padding: 5px 12px; background: #b91c1c; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Unit 5: Removing &amp; Updating Nodes</h1>

    <div class="panel">
        <button id="addTaskBtn">Add New Task</button>
        <button id="updateFirstBtn">Update First Task Text</button>
        <div id="taskList">
            <div class="task-item">Task 1: Revise HTML <button class="remove-btn">Remove</button></div>
            <div class="task-item">Task 2: Practice CSS <button class="remove-btn">Remove</button></div>
        </div>
        <div id="output"></div>
    </div>

    <script src="Updating Nodes.js"></script>
</body>
</html>
