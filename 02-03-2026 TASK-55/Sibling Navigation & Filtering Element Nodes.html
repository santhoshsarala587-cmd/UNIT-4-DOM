<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 3 - Sibling Navigation</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #ecfeff;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #0e7490;
            font-size: 24px;
            color: #0e7490;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #0e7490;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #0e7490;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        .item { margin: 6px 0; padding: 10px; background: #cffafe; border-left: 5px solid #0891b2; border-radius: 4px; }
        #middle { background: #a5f3fc; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Unit 3: Sibling Navigation &amp; Filtering Element Nodes</h1>

    <div class="panel">
        <div id="siblingContainer">
            <div class="item" id="first">First (Mango)</div>
            <div class="item" id="middle">Middle (Orange)</div>
            <div class="item" id="last">Last (Grapes)</div>
        </div>
        <button id="nextPrevBtn">Get Next &amp; Previous Sibling of Middle</button>
        <button id="filterBtn">Filter Only Element Nodes</button>
        <div id="output"></div>
    </div>

    <script src="Sibling Navigation & Filtering Element Nodes.js"></script>
</body>
</html>
