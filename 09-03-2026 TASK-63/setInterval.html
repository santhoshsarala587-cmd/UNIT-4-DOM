<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 11 - Repeated Timer (setInterval)</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f0f9ff;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #0369a1;
            font-size: 24px;
            color: #0369a1;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #0369a1;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #0369a1;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        .panel { text-align: center; }
        .stopwatch { padding: 20px; background: #0f172a; color: #38bdf8; border-radius: 10px; }
        .stopwatch h3 { margin-top: 0; }
        #stopwatchDisplay { margin: 8px 0 16px; font-family: Consolas, "Courier New", monospace; font-size: 54px; font-weight: bold; }
        .stop { background: #b91c1c; }
        #output { text-align: left; max-height: 160px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Unit 11: Repeated Timer (setInterval)</h1>

    <div class="panel">
        <div class="stopwatch">
            <h3>Study Stopwatch</h3>
            <div id="stopwatchDisplay">0:00</div>
            <button id="startBtn">Start</button>
            <button id="pauseBtn" class="stop">Pause</button>
            <button id="lapBtn">Lap</button>
            <button id="resetBtn">Reset</button>
        </div>
        <div id="output"></div>
    </div>

    <script src="setInterval.js"></script>
</body>
</html>
