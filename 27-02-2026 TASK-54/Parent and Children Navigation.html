<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 2 - Parent &amp; Children Navigation</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f0fdf4;
            color: #1f2937;
        }

        h1 {
            margin: 0 0 20px;
            padding-left: 12px;
            border-left: 6px solid #15803d;
            font-size: 24px;
            color: #15803d;
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        button {
            padding: 9px 16px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 6px;
            background: #15803d;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.88; }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #15803d;
            outline-offset: 2px;
        }

        #output, #outputArea {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 60px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        #output p, #outputArea p { margin: 4px 0; }

        #demo { padding: 8px; border: 2px solid #86efac; border-radius: 8px; }
        #demo div { margin: 6px; padding: 10px; background: #dcfce7; border-left: 5px solid #16a34a; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Unit 2: Parent &amp; Children Navigation</h1>

    <div class="panel">
        <div id="demo">
            <div id="child1">Child 1 - HTML</div>
            <div id="child2">Child 2 - CSS</div>
            <div id="child3">Child 3 - JavaScript</div>
        </div>
        <button id="parentBtn">Show parent of child2</button>
        <button id="childrenBtn">Show children of demo</button>
        <button id="firstLastBtn">Show first &amp; last child</button>
        <div id="output"></div>
    </div>

    <script src="Parent and Children Navigation.js"></script>
</body>
</html>
